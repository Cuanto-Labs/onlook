# Onlook web app on deb. Run from repo root:
#   docker compose -f deploy/cuanto/docker-compose.yml --env-file /opt/onlook/onlook.env up -d --build
# Host networking: binds 127.0.0.1:3100 only and reaches Supabase on 127.0.0.1:54321/54322.
name: onlook
services:
  web:
    container_name: onlook-web
    build:
      context: ../..
      dockerfile: deploy/cuanto/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_PASSWORD_LOGIN: ${NEXT_PUBLIC_PASSWORD_LOGIN:-true}
    env_file:
      - /opt/onlook/onlook.env
    network_mode: host
    # deb's resolver maps *.ts.net to public IPv6, not MagicDNS; server-side Supabase calls hang without this.
    extra_hosts:
      - "deb.tail789fa0.ts.net:100.117.179.10"
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m

  # Preview runner: one Docker container per Onlook project (see runner/API.md). Build the sandbox image first:
  #   docker build -t onlook-sandbox:1 deploy/cuanto/sandbox
  # Runs as root INSIDE its container: it chowns project dirs to 1000:1000 and uses the host docker.sock.
  # /opt/onlook/projects is mounted at the same path so bind-mount paths it hands to Docker are valid on the host.
  # Needs RUNNER_SECRET (>= 32 chars) in /opt/onlook/onlook.env; web shares it to sign tokens.
  runner:
    container_name: onlook-runner
    build:
      context: ../..
      dockerfile: deploy/cuanto/runner/Dockerfile
    env_file:
      - /opt/onlook/onlook.env
    network_mode: host
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/onlook/projects:/opt/onlook/projects
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
